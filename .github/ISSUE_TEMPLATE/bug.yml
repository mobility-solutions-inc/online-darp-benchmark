name: Bug report
description: Report incorrect tooling, documentation, data, or results.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not put security, private benchmark, or personal data in a public issue.
  - type: input
    id: version
    attributes:
      label: Benchmark version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Instance or source data
        - Result or scorecard
        - Validator or schema
        - Documentation
        - Governance or process
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include exact IDs, commands, and error output where relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction

