[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "online-darp-benchmark"
version = "0.1.0"
description = "Validation tools for the Online DARP Benchmark"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mobility Solutions Inc"}]
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "pyarrow>=21,<22",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
]

[project.scripts]
odb-validate = "online_darp_benchmark.validate:main"
odb-convert-eccel = "online_darp_benchmark.convert_eccel:main"
odb-convert-nyc = "online_darp_benchmark.convert_nyc:main"
odb-convert-ontra-manhattan = "online_darp_benchmark.convert_ontra_manhattan:main"
odb-fetch-nyc = "online_darp_benchmark.fetch_nyc:main"
odb-validate-collection = "online_darp_benchmark.parquet_collection:main"

[project.urls]
Homepage = "https://mobility-solutions-inc.github.io/online-darp-benchmark/"
Repository = "https://github.com/mobility-solutions-inc/online-darp-benchmark"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
