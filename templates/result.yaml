# Start from examples/result.yaml and replace every value below. Do not delete
# failed or unsupported runs; use run_status and failure_reason.
schema_version: 0.3.0
result_id: <algorithm.instance.lookahead.seed>
benchmark_version: <semantic-version>
instance_id: <instance-id>
# Use null only for a hidden result whose raw checksum must remain confidential.
instance_sha256: <64-lowercase-hex-characters-or-null>
supersedes_result_id: null
standing:
  instance_visibility: <public-or-hidden>
  classification: <official-contributor_reference-or-unofficial>
  official: false
  access:
    instance_contributor_involved: false
    algorithm_team_had_pre_evaluation_access: false
    controlled_evaluation: false
    evaluation_operator: null
    access_attestation_uri: null
  conflicts: []
  eligibility_notes: <why-this-standing-applies>
algorithm:
  name: <algorithm-name>
  version: <release-or-commit>
  team:
    - name: <person-name>
      github: <github-handle-or-null>
      roles:
        - <author-controller-tuner-or-configurator>
  # Link to the evaluated source, preferably an immutable commit, when public.
  code_available_publicly: <true-or-false>
  public_code_url: <public-code-url-or-null>
  artifact_url: <immutable-source-or-container-url>
  artifact_digest: <commit-or-container-digest>
  internal_objective: <objective-or-reward-description>
  hard_and_soft_constraints: <constraint-description>
  prediction_data_track: <none-provided_only-or-external_disclosed>
  uses_prediction: false
  training_and_tuning_data: null
  allows_relocation: false
  relocation_policy: null
evaluation:
  mode: online
  offline_objective: null
  horizons:
    information: <seconds-or-full>
    planning: <seconds-or-full>
    commitment: <nonnegative-seconds>
  acceptance_policy:
    accepted_request_may_be_rejected: false
    accepted_request_may_be_reassigned: false
    pickup_promise_may_change: false
run:
  run_status: <completed-timeout-out_of_memory-error-or-unsupported>
  failure_reason: null
  random_seed: <nonnegative-integer>
  started_at: <rfc3339-timestamp>
  hardware: <cpu-memory-and-accelerator>
  operating_system: <os-and-version>
  time_limit_seconds: <positive-integer>
  memory_limit_mb: <positive-integer>
# Copy the complete metrics matrix from examples/result.yaml for completed runs.
artifacts:
  event_log_uri: <relative-path-or-immutable-url>
  event_log_sha256: <64-lowercase-hex-characters>
  solution_uri: null
  invocation: <exact-command-or-workflow>
notes: null
